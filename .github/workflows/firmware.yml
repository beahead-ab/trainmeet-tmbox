name: Build TMBox firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The renderer and its state machines are plain C++17 with no
      # dependencies, so they run before anything is downloaded - and keep
      # running on a day the PlatformIO registry is unreachable.
      - name: Test renderer and state machines without hardware
        run: make -C firmware/esp32/test_native test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Both suites are dependency-free, so they run before PlatformIO is
      # fetched. The docs tests hold the documentation to the firmware: they
      # are what caught a spec describing a key that navigation.cpp never
      # handles.
      - name: Test the version tool and the documentation
        run: python -m unittest discover -s tests
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build supported profiles
        working-directory: firmware/esp32
        run: pio run -e esp32-benny -e esp32-classic-safe -e esp32-s3
  esp8266:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.1.18
      - name: Test input safety
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/esp8266_input_test.cpp -o /tmp/esp8266-input-test && /tmp/esp8266-input-test
      - name: Build NodeMCU firmware and hardware check
        working-directory: firmware/esp8266
        run: pio run -e nodemcu-i2c -e nodemcu-hardware-check
      - name: Upload NodeMCU binaries
        uses: actions/upload-artifact@v4
        with:
          name: trainmeet-tmbox-nodemcu-esp8266
          path: firmware/esp8266/.pio/build/*/firmware.bin
