name: Verified firmware downloads

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/version.py check
      - run: python -m unittest discover -s tests
      - run: make -C firmware/esp32/test_native test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/esp8266_input_test.cpp -o /tmp/esp8266-input-test && /tmp/esp8266-input-test
      - run: python scripts/package_firmware.py --output downloads
      - uses: actions/upload-artifact@v4
        with:
          name: source-downloads
          path: downloads/*
          if-no-files-found: error

  compile-download:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {kind: arduino, target: esp32-s3}
          - {kind: arduino, target: esp32-benny}
          - {kind: arduino, target: esp32-classic-safe}
          - {kind: arduino, target: nodemcu-i2c}
          - {kind: arduino, target: nodemcu-hardware-check}
          - {kind: platformio, target: esp32}
          - {kind: platformio, target: esp8266}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: source-downloads
          path: downloads
      - uses: arduino/setup-arduino-cli@v2
        if: matrix.kind == 'arduino'
        with:
          version: '1.3.1'
      # The ESP32 2.0.17 core ships a Python esptool, not its Python deps.
      - run: python -m pip install esptool==4.5.1
        if: matrix.kind == 'arduino' && startsWith(matrix.target, 'esp32')
      - run: python -m pip install platformio==6.1.18
        if: matrix.kind == 'platformio'
      - name: Build the actual extracted download
        run: >-
          python scripts/check_firmware_package.py
          --kind '${{ matrix.kind }}' --target '${{ matrix.target }}'
          'downloads/trainmeet-tmbox-${{ matrix.kind }}-${{ matrix.target }}.zip'

  publish:
    needs: [package, compile-download]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: source-downloads
          path: downloads
      - name: Publish only verified versioned downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; do not overwrite published downloads.'
            exit 0
          fi
          gh release create "$TAG" downloads/* --verify-tag --prerelease \
            --title "TrainMeet TMBox $TAG – Arduino IDE och PlatformIO" \
            --notes-file docs/FIRMWARE-DOWNLOADS.md
