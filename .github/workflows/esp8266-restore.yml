name: ESP8266 restore tool

on:
  push:
    paths:
      - 'tools/esp8266-restore/**'
      - 'tools/esp8266-backup/**'
      - '.github/workflows/esp8266-restore.yml'
  pull_request:
    paths:
      - 'tools/esp8266-restore/**'
      - 'tools/esp8266-backup/**'
      - '.github/workflows/esp8266-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install esptool==4.11.0
      - name: Test backup and restore with simulated flash and native launchers
        run: |
          python -m unittest discover -s tools/esp8266-backup/tests -v
          python -m unittest discover -s tools/esp8266-restore/tests -v
      - name: Confirm the pinned CLI parses the exact flash operations
        run: |
          python -m esptool read_flash --help
          python -m esptool write_flash --help
          python -m esptool verify_flash --help

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/esp8266-restore/package.py --output restore-package --source-commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: esp8266-restore-tool
          path: restore-package/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/tools/esp8266-full-restore'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: esp8266-restore-tool
          path: restore-package
      - name: Verify and publish the tested scripts without replacing existing assets
        working-directory: restore-package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c trainmeet-esp8266-restore-1.0.0.zip.sha256
          gh release view v0.9.0-wifi-test.1 --repo beahead-ab/trainmeet-tmbox --json isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == true)' | python3 -c 'import sys,json; assert json.load(sys.stdin)["isDraft"] is False'
          gh release upload v0.9.0-wifi-test.1 --repo beahead-ab/trainmeet-tmbox trainmeet-esp8266-restore-1.0.0.zip trainmeet-esp8266-restore-1.0.0.zip.sha256
          gh release view v0.9.0-wifi-test.1 --repo beahead-ab/trainmeet-tmbox --json body --jq .body > release-notes.md
          cat >> release-notes.md <<'NOTES'

          ## Enkel fullständig återställning från backup

          [Hämta återställningsverktyget för Mac och Windows](https://github.com/beahead-ab/trainmeet-tmbox/releases/download/v0.9.0-wifi-test.1/trainmeet-esp8266-restore-1.0.0.zip) · [Kontrollsumma](https://github.com/beahead-ab/trainmeet-tmbox/releases/download/v0.9.0-wifi-test.1/trainmeet-esp8266-restore-1.0.0.zip.sha256)

          Packa upp hela ZIP-filen och dubbelklicka på **Aterstall-ESP8266-Mac.command** eller **Aterstall-ESP8266-Windows.cmd**. Välj den kompletta, verifierade backupmappen från backupverktyget och rätt USB-port. Python 3.10 eller senare krävs.

          **Återställningen ersätter hela boxens program och lokala inställningar.** Verktyget kräver rätt ESP8266, samma MAC-adress och samma minnesstorlek, kontrollerar SHA-256 och tar först en ny verifierad säkerhetskopia av boxens nuvarande innehåll. Skriv **ATERSTALL** vid bekräftelsen för att börja skriva. Efteråt verifieras hela minnet. En avbruten skrivning eller misslyckad kontroll är inte en godkänd återställning.

          Ingen fysisk box har återställts av utvecklingsarbetet. Skript/startfiler och felhantering testas med simulerad flash på Mac, Windows och Linux. Läs LAS-MIG.txt i paketet och håll backupfiler privata. Verktyget laddar inte upp dem.
          NOTES
          gh release edit v0.9.0-wifi-test.1 --repo beahead-ab/trainmeet-tmbox --notes-file release-notes.md
