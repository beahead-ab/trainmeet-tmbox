[platformio]
default_envs = esp32-s3

[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
extra_scripts = post:../../scripts/export_web_firmware.py
lib_ldf_mode = deep+
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  arduino-libraries/ArduinoMqttClient@0.1.8
  chris--a/Keypad@3.1.1
  marcoschwartz/LiquidCrystal_I2C@1.1.4
  tzapu/WiFiManager@2.0.17

; TMBox v2. Det här är produkten - se docs/TMBOX-V2-HARDWARE.md.
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = -D TMBOX_HARDWARE_PROFILE=2

; Klassisk ESP32. Behålls för den som ska få igång ett kort som råkar finnas,
; inte som produkt. Ingen av dem beskriver TMBox v1 Legacy - de boxarna är
; ESP8266 och behåller sin egen firmware.
[env:esp32-benny]
board = esp32dev
build_flags = -D TMBOX_HARDWARE_PROFILE=1

[env:esp32-classic-safe]
board = esp32dev
build_flags = -D TMBOX_HARDWARE_PROFILE=3
