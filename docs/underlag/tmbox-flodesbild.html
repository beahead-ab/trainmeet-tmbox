        trackchoice: [

          {a:1,t:&#x27;2. Trainmeet föreslår spår&#x27;,k:&#x27;tidtabell + historik&#x27;,s2:&#x27;421 [1A] FORSL\nTIDTABELL: 1A&#x27;,s4:&#x27;TAG 421 MOT VST\nTIDTABELL: 1A\nFORSLAG: 1A\nSENAST: 1B&#x27;,c:&#x27;track.context {scheduled:&quot;1A&quot;, suggested:&quot;1A&quot;, last_used:&quot;1B&quot;, allowed:[&quot;1A&quot;,&quot;1B&quot;,&quot;2A&quot;,&quot;2B&quot;]}&#x27;,n:&#x27;Förslaget kontrolleras mot dagens tidtabell, riktning, spärrar och beläggning. Historik får hjälpa men skriver aldrig över tidtabellen.&#x27;,kind:&#x27;down&#x27;},

          {a:1,t:&#x27;9. Byte under väntande begäran skapar revision&#x27;,k:&#x27;B=ändra · D=mer&#x27;,s2:&#x27;421 [1B] VANTAR\nB=ANDR D=MER&#x27;,s4:&#x27;TAG 421 SPAR 1B\nVANTAR PA KLART\nB=ANDRA SPAR\nD=MER&#x27;,c:&#x27;change_track → clearance.revise or cancel + new request&#x27;,n:&#x27;Spårbytet får inte ske tyst. Trainmeet uppdaterar motstationens väntande ärende eller makulerar det och skapar en ny begäran.&#x27;,kind:&#x27;warn&#x27;},

          {a:1,t:&#x27;11. Efter avgång låses avgångsspåret&#x27;,k:&#x27;D=mer&#x27;,s2:&#x27;421 AVGICK 1B\nSPARET AR LAST&#x27;,s4:&#x27;TAG 421\nAVGICK SPAR 1B\nAVGANGSSPAR LAST\nD=MER&#x27;,c:&#x27;origin_track immutable after train.departed&#x27;,n:&#x27;Mottagande TKL kan fortfarande ändra tågets ankomstspår. Avgångsspår och ankomstspår är skilda fält.&#x27;,kind:&#x27;warn&#x27;}

        return pairs.map(pair =&gt; {
          const left = pair[0] || &#x27;&#x27;;
          const right = pair[1] || &#x27;&#x27;;
          const gap = Math.max(1, cols - left.length - right.length);
          return (left + &#x27; &#x27;.repeat(gap) + right).slice(0, cols);
        }).join(&#x27;\n&#x27;);

          cell.textContent = String(i % 10);
          ruler.appendChild(cell);

        const sourceLines = String(text || &#x27;&#x27;).split(&#x27;\n&#x27;);
        const placeNames = [
          [&#x27;LEK&#x27;, &#x27;LEKBY&#x27;],
          [&#x27;VST&#x27;, &#x27;VAGNSTA&#x27;],
          [&#x27;KUN&#x27;, &#x27;KUNGSFORS&#x27;],
          [&#x27;CDA&#x27;, &#x27;CHARLOTTENDAL&#x27;]

        const expandNames = value =&gt; {
          let result = value;
          placeNames.forEach(pair =&gt; {
            const pattern = new RegExp(&#x27;\\b&#x27; + pair[0] + &#x27;\\b&#x27;);
            const candidate = result.replace(pattern, pair[1]);
            if (candidate.length &lt;= cols) result = candidate;

          return result;

        const spoken = [];
        for (let row = 0; row &lt; rows; row++) {
          const raw = expandNames(sourceLines[row] || &#x27;&#x27;);
